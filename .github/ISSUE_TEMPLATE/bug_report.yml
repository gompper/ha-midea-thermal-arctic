name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The diagnostics file is the most useful thing you can attach: it contains every register the integration reads, often enough to reproduce the problem in a test. The gateway's host is removed from it.
  - type: textarea
    id: problem
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.11.0"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Integration version
      description: Shown in HACS, or in manifest.json
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: heat_pump
    attributes:
      label: Heat pump model and capacity
      placeholder: "M-Thermal Arctic R290, 4 kW"
    validations:
      required: true
  - type: input
    id: gateway
    attributes:
      label: Modbus gateway
      placeholder: "Elfin EW11A"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Device page → ⋮ → Download diagnostics. Drag the file in here.
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: Settings → System → Logs, filtered for `midea_m_thermal` or `modbus`
      render: text
