name: Release

on:
  release:
    types: [published]

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches manifest version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          manifest="$(jq -r .version custom_components/midea_m_thermal/manifest.json)"
          if [ "$TAG" != "v$manifest" ]; then
            echo "::error::Release tag $TAG does not match manifest version $manifest (expected v$manifest)"
            exit 1
          fi
